config:
  (): colpali_engine.trainer.colmodel_training.ColModelTrainingConfig
  output_dir: /gcs/colqwen-ns-models/qwen2_5-linear
  processor:
    (): colpali_engine.utils.transformers_wrappers.AllPurposeWrapper
    class_to_instanciate: !ext colpali_engine.models.ColQwen2_5_Processor
    pretrained_model_name_or_path: Qwen/Qwen2.5-VL-3B-Instruct
    # num_image_tokens: 2048
    # max_length: 50

  model:
    (): colpali_engine.utils.transformers_wrappers.AllPurposeWrapper
    class_to_instanciate: !ext colpali_engine.models.ColQwen2_5
    pretrained_model_name_or_path: Qwen/Qwen2.5-VL-3B-Instruct
    torch_dtype:  !ext torch.bfloat16
    use_cache: false
    attn_implementation: "flash_attention_2"
#    device_map: "auto"
#    quantization_config:
#      (): transformers.BitsAndBytesConfig
#      load_in_4bit: true
#      bnb_4bit_quant_type: "nf4"
#      bnb_4bit_compute_dtype:  "bfloat16"
#      bnb_4bit_use_double_quant: true

  # dataset_loading_func: !ext colpali_engine.utils.dataset_transformation.load_train_set
  # eval_dataset_loader: !import ../data/test_data.yaml
  train_dataset:
    (): colpali_engine.utils.dataset_transformation.load_train_set
    dataset_path: smith-nathanh/finance-dataset
  eval_dataset:
    (): colpali_engine.utils.dataset_transformation.load_eval_set
    dataset_path: smith-nathanh/finance-dataset

  # max_length: 50
  run_eval: true
  full_corpus_eval: true  # Full-corpus retrieval evaluation over the entire eval set
  compute_retrieval_metrics: true
  doc_block_size: 64 # Number of doc embeddings scored per block to control VRAM
  train_only_linear: true  # Train only the linear projection layer
  loss_func:
    (): colpali_engine.loss.late_interaction_losses.ColbertPairwiseCELoss
  tr_args:
    (): transformers.training_args.TrainingArguments
    output_dir: null
    overwrite_output_dir: true
    num_train_epochs: 2
    per_device_train_batch_size: 8
    gradient_checkpointing: true
    gradient_checkpointing_kwargs: { "use_reentrant": false }
    # gradient_checkpointing: true
    # 6 x 8 gpus = 48 batch size
    # gradient_accumulation_steps: 4
    per_device_eval_batch_size: 16
    eval_strategy: "steps"
    dataloader_num_workers: 8
    # bf16: true
    save_steps: 500
    logging_steps: 10
    eval_steps: 100
    warmup_steps: 500
    learning_rate: 1e-4
    save_total_limit: 1
    # resume_from_checkpoint: true
    # optim: "paged_adamw_8bit"
    # wandb logging
    run_name: qwen2_5-linear
    report_to: wandb