config:
  (): colpali_engine.trainer.colmodel_training.ColModelTrainingConfig
  output_dir: /gcs/colqwen-ns-models/colfastvlm-500-vidore-ray-short-best

  processor:
    (): colpali_engine.utils.transformers_wrappers.AllPurposeWrapper
    class_to_instanciate: !ext colpali_engine.models.ColFastVLMProcessor
    pretrained_model_name_or_path: apple/FastVLM-0.5B
    trust_remote_code: true
    use_fused_prompt: true
    
  model:
    (): colpali_engine.utils.transformers_wrappers.AllPurposeWrapper
    class_to_instanciate: !ext colpali_engine.models.ColFastVLM
    pretrained_model_name_or_path: apple/FastVLM-0.5B
    torch_dtype: !ext torch.bfloat16
    trust_remote_code: true
    use_cache: false
    attn_implementation: "flash_attention_2"
    # Retrieval-specific overrides
    mask_non_image_embeddings: true   # zero out prompt/text tokens for image-docs so only visual tokens contribute
    fuse_in_decoder: true
      
  train_dataset:
    (): colpali_engine.utils.dataset_transformation.load_train_set
    dataset_path: vidore/colpali_train_set
  eval_dataset:
    (): colpali_engine.utils.dataset_transformation.load_eval_set
    dataset_path: vidore/colpali_train_set
    split: test
  
  # max_length: 50
  run_eval: true
  full_corpus_eval: true  # Full-corpus retrieval evaluation over the entire eval set
  compute_retrieval_metrics: true
  doc_block_size: 64 # Number of doc embeddings scored per block to control VRAM
  loss_func:
    (): colpali_engine.loss.late_interaction_losses.ColbertPairwiseCELoss
    
  tr_args:
    (): transformers.training_args.TrainingArguments
    output_dir: null
    overwrite_output_dir: true
    num_train_epochs: 1
    per_device_train_batch_size: 32
    gradient_checkpointing: true
    gradient_checkpointing_kwargs: { "use_reentrant": false }
    gradient_accumulation_steps: 1
    per_device_eval_batch_size: 32
    eval_strategy: "steps"
    dataloader_num_workers: 8
    bf16: true
    save_steps: 1000
    logging_steps: 100
    eval_steps: 500
    #warmup_steps: 1000
    warmup_ratio: 0.02
    learning_rate: 0.000144
    save_total_limit: 1
    # resume_from_checkpoint: true
    # optim: "paged_adamw_8bit"
    run_name: "colfastvlm-500-vidore-ray-short-best"
    report_to: "wandb"
    
  peft_config:
    (): peft.LoraConfig
    r: 32
    lora_alpha: 32
    lora_dropout: 0.1
    init_lora_weights: "gaussian"
    bias: "none"
    task_type: "FEATURE_EXTRACTION"
    target_modules: '(.*(model\.model\.layers)\..*\.(self_attn|mlp)\.(down_proj|gate_proj|up_proj|k_proj|q_proj|v_proj|o_proj).*$|.*(model\.model\.mm_projector)\.(0|2).*$)'
    modules_to_save: ["custom_text_proj"]
